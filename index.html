<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى محاربتي العظيمة ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff1a1a;
            --dark-red: #660000;
            --bg-overlay: rgba(0, 0, 0, 0.377);
            --text-color: #fff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #00000000;
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }

        /* 1. خلفية الفيديو المتحركة */
        .video-background {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2;
            filter: blur(3px) contrast(1.2); /* تأثير ضبابي خفيف وعمق */
            object-fit: cover;
        }

        /* طبقة تظليل فوق الفيديو لضمان وضوح النص */
        .video-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-overlay);
            z-index: -1;
        }

        /* تأثير النيون */
        .neon-text {
            font-family: 'Cinzel', serif;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-red), 0 0 30px var(--neon-red);
            letter-spacing: 2px; text-align: center;
        }

        /* شاشة الدخول - متمركزة تماماً */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; transition: 2s ease-in-out;
        }

        .login-box {
            background: rgba(10, 10, 10, 0.9); padding: 50px;
            border: 2px solid var(--dark-red); text-align: center;
            width: 85%; max-width: 400px;
            box-shadow: 0 0 30px var(--dark-red);
            backdrop-filter: blur(10px);
            /* لضمان توسيط العناصر الداخلية */
            display: flex; flex-direction: column; align-items: center;
        }

        input {
            width: 100%; padding: 15px; margin: 10px 0;
            border: 1px solid var(--dark-red); background: rgba(0,0,0,0.5);
            color: #fff; text-align: center; outline: none;
            box-sizing: border-box; /* لضمان الحشو لا يزيد العرض */
        }

        input:focus { border-color: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }

        .btn-neon {
            width: 100%; padding: 15px; background: transparent; color: #fff;
            border: 2px solid var(--neon-red); cursor: pointer; font-weight: bold;
            text-shadow: 0 0 10px var(--neon-red);
            box-shadow: 0 0 15px var(--neon-red), inset 0 0 10px var(--neon-red);
            transition: 0.5s; margin-top: 15px; box-sizing: border-box;
        }

        .btn-neon:hover { background: var(--neon-red); box-shadow: 0 0 40px var(--neon-red); }

        /* المحتوى الرئيسي */
        #main-content {
            display: none; flex-direction: column; align-items: center;
            padding: 50px 20px; opacity: 0; transition: 3s ease;
        }

        /* 2. أنيميشن النبض السلس للصور */
        @keyframes smoothHeartbeat {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(128, 0, 0, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px var(--neon-red); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(128, 0, 0, 0.4); }
        }

        .gallery {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 30px;
            margin: 50px 0; max-width: 1000px;
        }

        .img-card {
            width: 280px; height: 380px;
            border: 2px solid var(--dark-red);
            overflow: hidden; cursor: pointer;
            animation: smoothHeartbeat 3s infinite ease-in-out; /* حركة أبطأ وأكثر سلاسة */
            transition: 0.5s ease;
        }

        .img-card:hover {
            animation-play-state: paused;
            transform: scale(1.05); border-color: var(--neon-red);
            box-shadow: 0 0 40px var(--neon-red);
        }

        .img-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }

        /* العداد نيون */
        #timer {
            font-size: 2.8rem; color: #fff; margin: 20px 0;
            text-shadow: 0 0 15px var(--neon-red), 0 0 5px #fff;
            font-family: 'Cinzel', serif; text-align: center;
        }

        /* 4. نافذة عرض الصور كببرة (Lightbox) */
        .modal {
            display: none; position: fixed; z-index: 3000;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center; align-items: center; flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            max-width: 90%; max-height: 80%;
            border: 3px solid var(--neon-red);
            box-shadow: 0 0 50px var(--neon-red);
        }

        .modal-caption {
            margin-top: 20px; color: #fff; font-size: 1.5rem; text-align: center;
            text-shadow: 0 0 10px var(--neon-red); max-width: 80%;
        }

        .close-modal {
            position: absolute; top: 20px; right: 30px;
            color: #fff; font-size: 40px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .close-modal:hover { color: var(--neon-red); }

    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="video-background">
        <source src="vid.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div id="login-screen">
        <div class="login-box">
            <h1 class="neon-text" style="font-size: 2rem;">ACCESS CODE</h1>
            <input type="text" id="username" placeholder="اسمك بالعربي">
            <input type="text" id="password" placeholder="تاريخنا سوا">
            <button class="btn-neon" onclick="checkLogin()">UNLOCK MEMORIES</button>
            <div id="error-msg" style="margin-top: 15px; color: var(--neon-red); min-height: 20px; font-size: 0.9rem;"></div>
            <button onclick="document.getElementById('error-msg').innerText='لا ألف سلامة.. ركزي يا داليا 🙄'" 
                    style="background:none; border:none; color:#777; cursor:pointer; margin-top:15px; text-decoration:underline;">مش عارفة أسجل</button>
        </div>
    </div>

    <div id="main-content">
        <h1 class="neon-text" style="font-size: 5rem; margin: 0;">DALIA</h1>
        <div id="timer"></div>

        <div class="gallery">
            <div class="img-card" onclick="openModal('https://github.com/mohanedx054/test054/blob/b4b2e2e1d8e65ac8f1998c59b094fef34e38a405/3.JPG', 'أحلى قلب في الكون ❤️')"><img src="https://github.com/mohanedx054/test054/blob/b4b2e2e1d8e65ac8f1998c59b094fef34e38a405/3.JPG"></div>
            <div class="img-card" onclick="openModal('https://github.com/mohanedx054/test054/blob/c2674be0b12e381933587233ce9d07f93a9bdf3b/1.JPG', 'FUCK TO ANYONE ❤️')"><img src="https://github.com/mohanedx054/test054/blob/c2674be0b12e381933587233ce9d07f93a9bdf3b/1.JPG"></div>
            <div class="img-card" onclick="openModal('https://github.com/mohanedx054/test054/blob/6f15bc2d42e8c3c71551eed205b8f6496d287553/4.JPG', 'كل لحظة معاكي ذكرى ما بتتنسيش ✨')"><img src="https://github.com/mohanedx054/test054/blob/6f15bc2d42e8c3c71551eed205b8f6496d287553/4.JPG"></div>
            <div class="img-card" onclick="openModal('https://github.com/mohanedx054/test054/blob/08d14f1ddf0509800ee81de96bf60725122b2024/6.JPG', 'السيلفي ده خطف قلبي 😍')"><img src="https://github.com/mohanedx054/test054/blob/08d14f1ddf0509800ee81de96bf60725122b2024/6.JPG"></div>
            <div class="img-card" onclick="openModal('5.jpg', 'جمالك ملوش وصف 🤍')"><img src="5.jpg"></div>
            <div class="img-card" onclick="openModal('https://github.com/mohanedx054/test054/blob/d6478e65612173b5003be63c87dffe86805c366c/2.JPG', 'محاربتي الجميلة 💪❤️')"><img src="https://github.com/mohanedx054/test054/blob/d6478e65612173b5003be63c87dffe86805c366c/2.JPG"></div>
        </div>

        <div style="text-align: center; max-width: 700px; padding: 30px; font-size: 1.3rem; line-height: 2.2; background: rgba(0, 0, 0, 0.767); border-radius: 10px;">
            <p>ممكن اكون زعلان منك بس مستحيل افوت مناسبه مهمه زي دي من غير ما اقولك اني بحبك و عارف انك بتحاولي تكوني احسن عشاني و انا فخور بيكي و هفضل احبك و كل عيد و انتي عيدي ❤️✨</p>
            <h2 class="neon-text" style="font-size: 1.8rem; margin-top: 30px;">I LOVE MY GREAT WARRIOR 💪❤️</h2>
        </div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImg">
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <audio id="bgAudio" loop preload="auto"><source src="love.mp3" type="audio/mpeg"></audio>

    <script>
        // --- 1. Login & Content Activation ---
        function checkLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const validPass = ["1/11/2024", "1-11-2024", "1.11.2024"];

            if (user === "داليا" && validPass.includes(pass)) {
                activateContent();
            } else {
                document.getElementById('error-msg').innerText = "ركزي يا محاربتي 😂";
            }
        }

        function activateContent() {
            document.getElementById('bgAudio').play().catch(e => console.log("Audio waiting for interaction"));
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                const main = document.getElementById('main-content');
                main.style.display = 'flex';
                setTimeout(() => main.style.opacity = '1', 100);
            }, 2000);
        }

        // --- 2. Lightbox System ---
        function openModal(imgSrc, captionText) {
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('modalCaption').innerText = captionText;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // إغلاق النافذة عند الضغط المفاجئ خارج الصورة
        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // --- 3. Timer System ---
        function updateTimer() {
            const start = new Date("November 1, 2024").getTime();
            const diff = new Date().getTime() - start;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('timer').innerText = `${days} Togther Days`;
        }
        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
